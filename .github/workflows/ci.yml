# Enforces docs/BUILD_STANDARD.md on every change.
#
# Two jobs, split by cost. `checks` needs no browser and finishes in seconds,
# so it fails fast on the things that break most often. `stages` pays for a
# browser once and spends it on the composed frame and the full route — the
# tier that catches what structural tests cannot see.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless; do not pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gameplay, contract and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gameplay and the shared runtime contract
        run: npm test
      - name: Submitted image structure
        run: npm run test:art
      - name: Originals preserved byte-for-byte
        run: npm run validate:assets

  stages:
    name: Composed frame and full route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Every stage boots, plays and composes a correct frame
        run: npm run test:stage
      - name: The full Pilgrim Road completed with real input
        run: npm run test:route
      - name: Upload failing frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-frames
          path: tmp/fail-*.png
          if-no-files-found: ignore
          retention-days: 7
